<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planechase Simulator</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --brand: #1777a1;
        --brand-light: #3aa3d1;
        --bg-canvas: #1a1a1a;
        --bg-panel: #2a2a2a;
        --bg-panel-raised: #333333;
        --bg-inset: #1a1a1a;
        --text-primary: #e0e0e0;
        --text-secondary: #909090;
        --text-muted: #707070;
        --text-heading: #ffffff;
        --border: #404040;
        --border-subtle: #333333;
        --color-error: #ff9999;
        --color-success: #7ee787;
        --color-link: #6cb2ff;
        --color-chaos: #e05c5c;
        --color-planeswalk: #5c8de0;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --shadow-md: 0 6px 14px rgba(0, 0, 0, 0.3);
        --focus-ring: 0 0 0 2px var(--brand-light);
        --transition-fast: 0.15s ease;
    }

    body {
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        min-height: 100vh;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    h1 { text-align: center; margin-bottom: 6px; color: var(--text-heading); font-size: 2em; }
    .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 25px; }

    .panel {
        background: var(--bg-panel);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        padding: 20px;
        margin-bottom: 20px;
    }

    .panel h2 {
        font-size: 1em;
        margin-bottom: 12px;
        color: #b0b0b0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    button {
        padding: 12px 18px;
        background: var(--brand);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 1em;
        cursor: pointer;
        transition: background var(--transition-fast);
    }
    button:hover { background: var(--brand-light); }
    button:disabled { background: var(--bg-panel-raised); color: var(--text-muted); cursor: not-allowed; }
    button.secondary { background: var(--bg-panel-raised); }
    button.secondary:hover { background: #444; }
    button.small { padding: 6px 12px; font-size: 0.85em; }
    button.danger { background: #7a2222; }
    button.danger:hover { background: #9a2c2c; }
    button.chaos-btn { background: var(--color-chaos); }
    button.chaos-btn:hover { background: #ff7373; }

    .setup-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .empty-note { color: var(--text-muted); font-style: italic; }

    input[type="text"] {
        padding: 10px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.95em;
    }
    input[type="text"]:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus-ring); }

    .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
    }

    .player-card {
        background: var(--bg-inset);
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
        transition: border-color 0.2s ease;
    }
    .player-card.phenom-pending { border-color: var(--color-chaos); }

    .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 8px;
    }
    .player-header input[type="text"] { flex: 1; font-weight: bold; }

    .player-stats { color: var(--text-secondary); font-size: 0.85em; margin-bottom: 12px; }
    .player-stats b { color: var(--text-primary); }

    /* Plane/Phenomenon cards are printed sideways on a normal portrait card
       body, so the raw Scryfall scan is portrait-shaped. This frame rotates
       the art 90deg into a landscape frame sized so the rotated image fills
       it exactly (card ratio 5:7 rotated -> frame ratio 7:5), so the card
       reads correctly without turning the phone. */
    .plane-frame {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 7 / 5;
        margin: 0 auto 10px;
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        background: var(--bg-panel-raised);
    }
    .plane-frame.phenom-frame { border-color: var(--color-chaos); box-shadow: 0 0 16px rgba(224, 92, 92, 0.35); }
    .plane-frame img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 71.4286%;
        height: 140%;
        transform: translate(-50%, -50%) rotate(90deg);
        cursor: zoom-in;
    }
    .plane-frame .plane-placeholder-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        text-align: center;
        padding: 16px;
        font-size: 0.85em;
    }

    .plane-name { text-align: center; font-weight: bold; color: var(--text-heading); margin-bottom: 2px; }
    .plane-type { text-align: center; color: var(--text-secondary); font-size: 0.8em; font-style: italic; margin-bottom: 8px; }
    .plane-oracle-text {
        white-space: pre-wrap;
        font-size: 0.85em;
        line-height: 1.4;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 10px;
        margin-bottom: 10px;
        max-height: 140px;
        overflow-y: auto;
    }

    .phenom-tag {
        display: block;
        text-align: center;
        background: var(--color-chaos);
        color: #1a1a1a;
        font-weight: bold;
        font-size: 0.75em;
        padding: 3px 8px;
        border-radius: 3px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .phenom-hint { text-align: center; color: var(--color-chaos); font-size: 0.8em; margin-bottom: 10px; }

    .player-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }

    .chain-log {
        font-size: 0.78em;
        color: var(--text-muted);
        max-height: 70px;
        overflow-y: auto;
        border-top: 1px solid var(--border-subtle);
        padding-top: 6px;
    }
    .chain-log div { padding: 2px 0; }
    .chain-log .phenom { color: var(--color-chaos); }

    .die-face {
        font-size: 2em;
        font-weight: bold;
        text-align: center;
        min-width: 70px;
        padding: 8px 0;
        border-radius: var(--radius-md);
        border: 2px solid var(--brand);
        background: var(--bg-panel-raised);
        margin: 0 auto 6px;
    }
    .die-face.chaos { color: var(--color-chaos); border-color: var(--color-chaos); }
    .die-face.planeswalk { color: var(--color-planeswalk); border-color: var(--color-planeswalk); }
    .die-face.blank { color: var(--text-muted); }

    @keyframes dieSpin {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.15) rotate(180deg); }
        100% { transform: scale(1) rotate(360deg); }
    }
    .die-face.rolling { animation: dieSpin 0.35s linear infinite; }

    @keyframes chaosPulse {
        0% { transform: scale(1); box-shadow: 0 0 0 rgba(224, 92, 92, 0.7); }
        25% { transform: scale(1.3); box-shadow: 0 0 10px 6px rgba(224, 92, 92, 0.9); }
        50% { transform: scale(0.92); box-shadow: 0 0 22px 10px rgba(224, 92, 92, 0.75); }
        75% { transform: scale(1.12); box-shadow: 0 0 12px 6px rgba(224, 92, 92, 0.6); }
        100% { transform: scale(1); box-shadow: 0 0 0 rgba(224, 92, 92, 0); }
    }
    .die-face.chaos.landed { animation: chaosPulse 0.9s ease; }

    @keyframes planeswalkPulse {
        0% { transform: scale(1); box-shadow: 0 0 0 rgba(92, 141, 224, 0.7); }
        40% { transform: scale(1.18); box-shadow: 0 0 14px 6px rgba(92, 141, 224, 0.8); }
        100% { transform: scale(1); box-shadow: 0 0 0 rgba(92, 141, 224, 0); }
    }
    .die-face.planeswalk.landed { animation: planeswalkPulse 0.7s ease; }

    @keyframes chaosShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-4px); }
        40% { transform: translateX(4px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
    }
    .player-card.chaos-shake { animation: chaosShake 0.4s ease; }

    @keyframes chaosBannerPop {
        0% { opacity: 0; transform: scale(0.6); }
        30% { opacity: 1; transform: scale(1.15); }
        60% { transform: scale(1); }
        100% { opacity: 0; transform: scale(1); }
    }
    .chaos-banner {
        text-align: center;
        font-weight: bold;
        color: var(--color-chaos);
        font-size: 1.05em;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        animation: chaosBannerPop 1.1s ease;
    }

    .die-result-label { text-align: center; font-size: 0.8em; color: var(--text-secondary); margin-bottom: 8px; }

    .lightbox-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 999;
        align-items: center;
        justify-content: center;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius-lg); }

    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--color-link); }
</style>
</head>
<body>
<div class="container">
    <h1>Planechase Simulator</h1>
    <p class="subtitle">Each player gets their own planar deck and planar zone, so multiple planes can be active around the table at once.</p>

    <div class="panel" id="setupPanel">
        <h2>1. Load Cards &amp; Add Players</h2>
        <div class="setup-row">
            <button id="loadBtn" onclick="loadPlaneCards()">Load All Planes &amp; Phenomena from Scryfall</button>
            <span id="loadStatus" class="empty-note"></span>
        </div>
        <div class="setup-row hidden" id="addPlayerRow">
            <input type="text" id="newPlayerName" placeholder="Player name" onkeydown="if(event.key==='Enter')addPlayer()">
            <button class="secondary" onclick="addPlayer()">Add Player</button>
            <span id="playerCountNote" class="empty-note"></span>
        </div>
    </div>

    <div class="panel hidden" id="playersPanel">
        <h2>2. Play</h2>
        <div class="players-grid" id="playersGrid"></div>
    </div>

    <a class="back-link" href="MTG_Lookup_Tool.html">&larr; Back to MTG Lookup Tool</a>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
</div>

<script>
    const API_BASE = 'https://api.scryfall.com';
    let allPlaneCards = [];
    let players = [];
    let nextPlayerId = 1;

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function loadPlaneCards() {
        const btn = document.getElementById('loadBtn');
        const status = document.getElementById('loadStatus');
        btn.disabled = true;
        status.textContent = 'Loading planes and phenomena from Scryfall...';
        try {
            let url = `${API_BASE}/cards/search?q=(type%3Aplane+or+type%3Aphenomenon)&order=name&unique=cards`;
            let cards = [];
            while (url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Scryfall request failed');
                const data = await res.json();
                cards = cards.concat(data.data);
                url = data.has_more ? data.next_page : null;
            }
            allPlaneCards = cards;
            const planeCount = cards.filter(c => /^Plane\b/.test(c.type_line)).length;
            const phenomCount = cards.length - planeCount;
            status.textContent = `Loaded ${cards.length} cards (${planeCount} planes, ${phenomCount} phenomena).`;
            document.getElementById('addPlayerRow').classList.remove('hidden');
        } catch (err) {
            status.textContent = 'Error loading cards: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function addPlayer() {
        if (allPlaneCards.length === 0) {
            alert('Load cards first.');
            return;
        }
        const nameInput = document.getElementById('newPlayerName');
        const name = nameInput.value.trim() || `Player ${players.length + 1}`;
        nameInput.value = '';

        players.push({
            id: nextPlayerId++,
            name,
            deck: shuffle([...allPlaneCards]),
            discard: [],
            current: null,
            pendingPhenomenon: null,
            log: [],
            rolling: false,
            rollFace: null,
            lastRoll: null,
            justLanded: false
        });

        document.getElementById('playersPanel').classList.remove('hidden');
        renderPlayers();
        document.getElementById('playerCountNote').textContent = `${players.length} player(s) at the table`;
    }

    function removePlayer(id) {
        players = players.filter(p => p.id !== id);
        renderPlayers();
        document.getElementById('playerCountNote').textContent = `${players.length} player(s) at the table`;
    }

    function isPhenomenon(card) {
        return /^Phenomenon\b/.test(card.type_line);
    }

    function imageUrl(card) {
        if (card.image_uris) return card.image_uris.normal || card.image_uris.large;
        if (card.card_faces && card.card_faces[0].image_uris) return card.card_faces[0].image_uris.normal;
        return null;
    }

    function getPlayer(id) {
        return players.find(p => p.id === id);
    }

    // Planeswalk: discard the current plane (if any) and start revealing
    // from the top of the planar deck.
    function startPlaneswalk(player) {
        if (!player || player.pendingPhenomenon || player.rolling) return;
        if (player.current) player.discard.push(player.current);
        player.current = null;
        player.log = [];
        revealNext(player);
    }

    // Reveals one card. A Phenomenon is shown as a prompt (its full text)
    // and the chain pauses there until the table clicks Continue - it does
    // not just flash by in a log. A Plane becomes the new active card and
    // the chain stops.
    function revealNext(player) {
        if (player.deck.length === 0) {
            if (player.discard.length === 0) {
                renderPlayers();
                return;
            }
            player.deck = shuffle([...player.discard]);
            player.discard = [];
        }
        const card = player.deck.pop();
        if (isPhenomenon(card)) {
            player.pendingPhenomenon = card;
            player.log.push({ phenom: true, name: card.name });
        } else {
            player.current = card;
            player.pendingPhenomenon = null;
        }
        renderPlayers();
    }

    // Called from the "Continue" button on a Phenomenon prompt: the
    // phenomenon's ability has been resolved at the table, so it's
    // discarded and the reveal continues automatically.
    function continuePhenomenon(player) {
        if (!player || !player.pendingPhenomenon) return;
        player.discard.push(player.pendingPhenomenon);
        player.pendingPhenomenon = null;
        revealNext(player);
    }

    async function rollDie(player) {
        if (!player || player.pendingPhenomenon || player.rolling) return;
        player.rolling = true;
        player.justLanded = false;
        renderPlayers();

        const faces = ['planeswalk', 'chaos', 'blank'];
        const frames = 9;
        for (let i = 0; i < frames; i++) {
            player.rollFace = faces[Math.floor(Math.random() * faces.length)];
            renderPlayers();
            await sleep(65 + i * 16);
        }

        const roll = Math.floor(Math.random() * 6) + 1;
        const face = roll === 1 ? 'planeswalk' : roll === 2 ? 'chaos' : 'blank';

        player.rolling = false;
        player.rollFace = null;
        player.lastRoll = face;
        player.justLanded = true;
        const cardEl = document.getElementById(`player-${player.id}`);
        if (face === 'chaos' && cardEl) {
            cardEl.classList.add('chaos-shake');
            setTimeout(() => cardEl.classList.remove('chaos-shake'), 450);
        }
        renderPlayers();
        setTimeout(() => {
            player.justLanded = false;
            renderPlayers();
        }, 1000);

        if (face === 'planeswalk') startPlaneswalk(player);
    }

    const FACE_SYMBOL = { planeswalk: '⊕', chaos: '☢', blank: '○' };

    function renderPlayers() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = players.map(p => {
            const showingFace = p.rolling ? p.rollFace : p.lastRoll;
            const dieClass = [
                showingFace || '',
                p.rolling ? 'rolling' : '',
                (p.justLanded && !p.rolling) ? 'landed' : ''
            ].filter(Boolean).join(' ');
            const dieSymbol = showingFace ? FACE_SYMBOL[showingFace] : '?';
            const dieLabel = p.rolling ? 'Rolling...'
                : p.lastRoll === 'planeswalk' ? 'PLANESWALK'
                : p.lastRoll === 'chaos' ? 'CHAOS'
                : p.lastRoll === 'blank' ? 'BLANK' : '-';

            const phenom = p.pendingPhenomenon;
            const phenomImg = phenom ? imageUrl(phenom) : null;

            let cardBody;
            if (phenom) {
                cardBody = `
                    <div class="plane-frame phenom-frame">
                        ${phenomImg
                            ? `<img src="${phenomImg}" alt="${escapeHtml(phenom.name)}" onclick="openLightbox('${phenomImg.replace(/'/g,"\\'")}','${escapeHtml(phenom.name)}')">`
                            : `<div class="plane-placeholder-text">${escapeHtml(phenom.name)}</div>`}
                    </div>
                    <span class="phenom-tag">Phenomenon Revealed</span>
                    <div class="plane-name">${escapeHtml(phenom.name)}</div>
                    <div class="plane-type">${escapeHtml(phenom.type_line)}</div>
                    <div class="plane-oracle-text">${escapeHtml(phenom.oracle_text || 'No reminder text on file.')}</div>
                    <div class="phenom-hint">Resolve this ability at the table, then continue revealing.</div>
                    <div class="player-actions">
                        <button class="small chaos-btn" onclick="continuePhenomenon(getPlayer(${p.id}))">Continue</button>
                    </div>
                `;
            } else {
                const img = p.current ? imageUrl(p.current) : null;
                cardBody = `
                    <div class="plane-frame">
                        ${p.current
                            ? (img
                                ? `<img src="${img}" alt="${escapeHtml(p.current.name)}" onclick="openLightbox('${img.replace(/'/g,"\\'")}','${escapeHtml(p.current.name)}')">`
                                : `<div class="plane-placeholder-text">${escapeHtml(p.current.name)}</div>`)
                            : `<div class="plane-placeholder-text">No active plane yet</div>`}
                    </div>
                    ${p.current ? `
                        <div class="plane-name">${escapeHtml(p.current.name)}</div>
                        <div class="plane-type">${escapeHtml(p.current.type_line)}</div>
                        <div class="plane-oracle-text">${escapeHtml(p.current.oracle_text || 'No reminder text on file.')}</div>
                    ` : ''}
                    <div class="player-actions">
                        <button class="small" ${p.rolling ? 'disabled' : ''} onclick="startPlaneswalk(getPlayer(${p.id}))">Planeswalk</button>
                        <button class="small secondary" ${p.rolling ? 'disabled' : ''} onclick="rollDie(getPlayer(${p.id}))">Roll Planar Die</button>
                    </div>
                    ${(p.justLanded && p.lastRoll === 'chaos') ? '<div class="chaos-banner">☢ CHAOS TRIGGERED! ☢</div>' : ''}
                    <div class="die-face ${dieClass}">${dieSymbol}</div>
                    <div class="die-result-label">${dieLabel}</div>
                `;
            }

            return `<div class="player-card${phenom ? ' phenom-pending' : ''}" id="player-${p.id}">
                <div class="player-header">
                    <input type="text" value="${escapeHtml(p.name)}" onchange="renamePlayer(${p.id}, this.value)">
                    <button class="small danger" onclick="removePlayer(${p.id})">Remove</button>
                </div>
                <div class="player-stats">Planar deck: <b>${p.deck.length}</b> &middot; Discard: <b>${p.discard.length}</b></div>

                ${cardBody}

                ${p.log && p.log.length ? `<div class="chain-log">
                    ${p.log.map(l => `<div class="${l.phenom ? 'phenom' : ''}">${l.phenom ? 'Phenomenon triggered: ' : 'Plane: '}<b>${escapeHtml(l.name)}</b></div>`).join('')}
                </div>` : ''}
            </div>`;
        }).join('');
    }

    function renamePlayer(id, name) {
        const p = getPlayer(id);
        if (p) p.name = name.trim() || p.name;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    function openLightbox(src, alt) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightboxImg').alt = alt;
        document.getElementById('lightboxOverlay').classList.add('open');
    }
    function closeLightbox() {
        document.getElementById('lightboxOverlay').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
