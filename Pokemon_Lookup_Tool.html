<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 2em;
        }

        .back-link {
            text-align: center;
            margin-bottom: 14px;
        }

        .back-link a {
            color: #6cb2ff;
            font-size: 0.85em;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .search-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .search-box {
            background: #2a2a2a;
            border: 2px solid #404040;
            border-radius: 8px;
            padding: 15px;
        }

        .search-box h2 {
            font-size: 1em;
            margin-bottom: 10px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1em;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 8px rgba(23, 119, 161, 0.4);
        }

        .autocomplete-list {
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #404040;
            border-radius: 4px;
            background: #1a1a1a;
        }

        .autocomplete-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: background 0.2s;
            font-size: 0.95em;
        }

        .autocomplete-item:hover {
            background: #2a2a2a;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--brand-light);
        }

        button:active {
            background: #003d7a;
        }

        .card-result {
            background: #2a2a2a;
            border: 2px solid #404040;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 25px;
        }

        .card-image-section {
            text-align: center;
        }

        .card-image {
            width: 100%;
            max-width: 240px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #404040;
            cursor: zoom-in;
            transition: transform 0.15s, border-color 0.15s, opacity 0.15s;
        }

        .card-image:hover {
            transform: scale(1.02);
            border-color: var(--brand);
        }

        .card-image.fading {
            opacity: 0.25;
        }

        .lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 30px;
        }

        .lightbox-overlay.open {
            display: flex;
        }

        .lightbox-overlay img {
            max-width: min(90vw, 700px);
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .price-block {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 12px;
        }

        .price-item {
            display: flex;
            flex-direction: column;
        }

        .price-value {
            font-size: 1.1em;
            color: #7ee787;
            font-weight: 600;
        }

        .price-link {
            color: #6cb2ff;
            font-size: 0.85em;
            text-decoration: none;
            align-self: flex-end;
        }

        .price-link:hover {
            text-decoration: underline;
        }

        .price-note {
            width: 100%;
            font-size: 0.78em;
            color: #707070;
            margin-top: 4px;
        }

        .set-symbol {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #404040;
        }

        .set-symbol img {
            max-width: 90%;
            max-height: 90%;
        }

        .set-symbol-name {
            font-size: 0.85em;
            color: #909090;
            margin-top: 8px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-name {
            font-size: 1.8em;
            color: #fff;
            border-bottom: 2px solid var(--brand);
            padding-bottom: 10px;
        }

        .card-detail {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
        }

        .detail-label {
            color: #909090;
            text-transform: uppercase;
            font-size: 0.85em;
            font-weight: 600;
            min-width: 80px;
        }

        .detail-value {
            color: #e0e0e0;
            font-size: 1em;
        }

        .adjacent-sets {
            background: #1a1a1a;
            border-left: 3px solid var(--brand);
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .adjacent-item {
            padding: 6px 0;
            font-size: 0.9em;
            color: #e0e0e0;
        }

        .set-link {
            color: #6cb2ff;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: rgba(108, 178, 255, 0.4);
        }

        .set-link:hover {
            color: #a3d0ff;
        }

        .all-printings {
            margin-top: 10px;
        }

        .all-printings summary {
            cursor: pointer;
            color: #909090;
            text-transform: uppercase;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 4px 0;
        }

        .all-printings summary:hover {
            color: #cfcfcf;
        }

        .printings-list {
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .printing-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .printing-item:hover {
            background: #262626;
            border-color: var(--brand);
        }

        .printing-item.active {
            border-color: var(--brand);
            background: #1e2c3d;
        }

        .printing-item.active .printing-set-name {
            color: #fff;
            font-weight: 600;
        }

        .printing-item img {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .printing-set-name {
            flex: 1;
        }

        .printing-meta {
            color: #909090;
            font-size: 0.85em;
        }

        .history-section {
            background: #2a2a2a;
            border: 2px solid #404040;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        .history-section h2 {
            margin-bottom: 15px;
            color: #b0b0b0;
            text-transform: uppercase;
            font-size: 0.95em;
            letter-spacing: 1px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-item {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.9em;
        }

        .history-item:hover {
            background: #333;
            border-color: var(--brand);
        }

        .clear-history {
            margin-top: 15px;
            padding: 8px 12px;
            font-size: 0.85em;
            width: auto;
        }

        .error {
            background: #3a1a1a;
            border: 2px solid #8b0000;
            border-radius: 8px;
            padding: 20px;
            color: #ff9999;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: #909090;
            padding: 20px;
        }

        :root {
            --brand: #1777a1;
            --brand-light: #3aa3d1;
        }

        h1 {
            border-bottom: 3px solid var(--brand);
            padding-bottom: 14px;
            display: inline-block;
        }

        .container > h1 {
            display: block;
            width: fit-content;
            margin: 0 auto 20px;
        }

        /* ---- Loading skeleton ---- */
        .skeleton-result {
            background: #2a2a2a;
            border: 2px solid #404040;
            border-radius: 8px;
            padding: 25px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 25px;
        }

        .skeleton-block {
            background: linear-gradient(90deg, #333 25%, #3d3d3d 37%, #333 63%);
            background-size: 400% 100%;
            animation: skeleton-shimmer 1.4s ease infinite;
            border-radius: 6px;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        .skeleton-image {
            width: 100%;
            height: 335px;
            border-radius: 12px;
        }

        .skeleton-lines {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeleton-line {
            height: 18px;
            width: 100%;
        }

        .skeleton-line.short { width: 40%; }
        .skeleton-line.title { height: 30px; width: 60%; }

        /* ---- Rarity badge ---- */
        .name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .rarity-badge {
            font-size: 0.65em;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid currentColor;
        }

        /* ---- Copy icon buttons ---- */
        .copy-icon {
            cursor: pointer;
            font-size: 0.6em;
            opacity: 0.6;
            transition: opacity 0.15s;
            user-select: none;
        }

        .copy-icon:hover {
            opacity: 1;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--brand);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Legality grid ---- */
        .legality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .legality-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.85em;
        }

        .legality-format {
            color: #c0c0c0;
            text-transform: capitalize;
        }

        .legality-status {
            font-size: 0.75em;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .legality-status.legal { background: #1e4620; color: #7ee787; }
        .legality-status.not_legal { background: #333; color: #707070; }
        .legality-status.banned { background: #4a1a1a; color: #ff9999; }

        /* ---- Moonshot stock check ---- */
        .moonshot-block {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-left: 3px solid var(--brand);
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
        }

        .moonshot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .moonshot-title {
            color: #909090;
            text-transform: uppercase;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .moonshot-check-btn {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8em;
            margin-top: 0;
        }

        .moonshot-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.9em;
        }

        .moonshot-result-item:last-child {
            border-bottom: none;
        }

        .moonshot-link {
            color: var(--brand-light);
            text-decoration: none;
            font-size: 0.85em;
        }

        .moonshot-link:hover {
            text-decoration: underline;
        }

        .moonshot-status {
            font-size: 0.85em;
            color: #909090;
        }

        @media (max-width: 768px) {
            .search-section {
                grid-template-columns: 1fr;
            }

            .card-result {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>

    <script>
        const MOONSHOT_BASE = 'https://moonshotgamestore.com';

        // Pokemon TCG API (pokemontcg.io) - free, public, covers every Pokemon
        // card ever printed with images, set data, and actual TCGplayer
        // low/mid/high/market price tiers built right into the card data.
        //
        // IMPORTANT: as of 2026 the team behind this API has shifted focus to
        // Scrydex, a paid commercial successor - this free v2 API still works
        // but gets less operational attention now, so occasional 429s (rate
        // limit) and transient 5xx server errors are more common than they
        // used to be. pokemonFetchWithRetry() below absorbs most of those
        // automatically. TCGdex (https://tcgdex.dev, no key needed, actively
        // maintained, pricing built in) is a viable full replacement if this
        // API's reliability degrades further - see chat notes for tradeoffs.
        const POKEMON_API_BASE = 'https://api.pokemontcg.io/v2';
        // Anonymous requests are capped at 1,000/day and 30/min. A free key
        // raises that to 20,000/day - given how much this tool searches,
        // getting one (https://dev.pokemontcg.io, instant, free) is the
        // single biggest reliability lever available. Paste it below.
        const POKEMON_API_KEY = '';

        function pokemonFetch(url, options) {
            const headers = POKEMON_API_KEY ? { 'X-Api-Key': POKEMON_API_KEY } : {};
            return fetch(url, { ...options, headers });
        }

        // Retries transient failures (429 rate-limit, 5xx server errors, or a
        // network-level failure) with a short exponential backoff before
        // giving up. Non-transient errors (400/404/etc) fail immediately.
        async function pokemonFetchWithRetry(url, { retries = 2, baseDelayMs = 500, signal } = {}) {
            let lastErr;
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const res = await pokemonFetch(url, { signal });
                    if (res.ok) return res;
                    if (res.status === 429 || res.status >= 500) {
                        lastErr = new Error(res.status === 429
                            ? 'Rate limited by the card database - please wait a moment and try again.'
                            : `The card database is having a temporary issue (server error ${res.status}).`);
                        lastErr.status = res.status;
                    } else {
                        const err = new Error(`Request failed (${res.status})`);
                        err.status = res.status;
                        throw err;
                    }
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                    lastErr = lastErr && lastErr.status ? lastErr : err;
                }
                if (attempt < retries) {
                    await new Promise(r => setTimeout(r, baseDelayMs * Math.pow(2, attempt)));
                }
            }
            throw lastErr;
        }
        let pokeSearchTimeout;
        let pokeSetsCache = null;
        let pokeCurrentPrints = [];
        let pokeCurrentDisplayedCard = null;
        let pokeCurrentCardSetId = null;
        let pokeCurrentCardSetName = null;
        let pokeCurrentCardReleasedAt = null;

["trainer kit plusle and minun","Trainer Kit - Plusle & Minun","EX","TK2",null],

        ];

        // Build a lookup map from the reference table (first match wins for
        // duplicate keys, e.g. "Trick or Trade" spans two different eras -
        // this is a best-effort reference, not authoritative per-printing data)
        const POKEMON_SET_REFERENCE_MAP = {};
        POKEMON_SET_REFERENCE.forEach(([key, name, era, num, checklist]) => {
            if (!POKEMON_SET_REFERENCE_MAP[key]) {
                POKEMON_SET_REFERENCE_MAP[key] = { name, era, num, checklist };
            }
        });

        function normalizePokemonSetKey(name) {
            return (name || '')
                .replace(/[‘’]/g, "'")
                .toLowerCase()
                .replace(/&/g, 'and')
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
        }

        function getPokemonSetReference(setName) {
            return POKEMON_SET_REFERENCE_MAP[normalizePokemonSetKey(setName)] || null;
        }

        // Load all Pokemon sets once, sorted by release date, for before/after context
        async function loadPokemonSets() {
            if (pokeSetsCache) return pokeSetsCache;
            try {
                const res = await pokemonFetch(`${POKEMON_API_BASE}/sets`);
                if (!res.ok) throw new Error('Failed to load sets');
                const data = await res.json();
                pokeSetsCache = (data.data || [])
                    .filter(s => s.releaseDate)
                    .sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
                return pokeSetsCache;
            } catch (err) {
                console.error('Error loading Pokemon sets:', err);
                pokeSetsCache = [];
                return pokeSetsCache;
            }
        }

        function getPokemonAdjacentSets(setId, releasedAt) {
            if (!pokeSetsCache || pokeSetsCache.length === 0) return { prev: null, next: null };
            const idx = pokeSetsCache.findIndex(s => s.id === setId);
            if (idx !== -1) {
                return {
                    prev: idx > 0 ? pokeSetsCache[idx - 1] : null,
                    next: idx < pokeSetsCache.length - 1 ? pokeSetsCache[idx + 1] : null
                };
            }
            if (!releasedAt) return { prev: null, next: null };
            const currentDate = new Date(releasedAt);
            let prev = null, next = null;
            for (const s of pokeSetsCache) {
                const sDate = new Date(s.releaseDate);
                if (sDate <= currentDate) prev = s;
                else if (!next) { next = s; break; }
            }
            return { prev, next };
        }

        // Pokemon history
        function loadPokemonHistory() {
            const history = JSON.parse(localStorage.getItem('pokemonHistory') || '[]');
            renderPokemonHistory(history);
        }

        function addToPokemonHistory(cardName) {
            let history = JSON.parse(localStorage.getItem('pokemonHistory') || '[]');
            history = history.filter(name => name !== cardName);
            history.unshift(cardName);
            history = history.slice(0, 20);
            localStorage.setItem('pokemonHistory', JSON.stringify(history));
            renderPokemonHistory(history);
        }

        function renderPokemonHistory(history) {
            const historyList = document.getElementById('pokeHistoryList');
            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: #606060; grid-column: 1/-1; text-align: center;">No recent lookups</p>';
                return;
            }
            historyList.innerHTML = history.map(card =>
                `<div class="history-item" onclick="performPokemonLookup('${card.replace(/'/g, "\\'")}')">${card}</div>`
            ).join('');
        }

        function clearPokemonHistory() {
            localStorage.removeItem('pokemonHistory');
            loadPokemonHistory();
        }

        // Live search with autocomplete (prefix wildcard on the name field)
        // Live search results are kept here so clicking one can jump straight
        // to that EXACT printing - Pokemon reuses names constantly (dozens of
        // "Pikachu" cards across 25+ years), so showing just the name in
        // autocomplete would be useless. We show name + set + card number,
        // which is how a specific Pokemon card is actually identified.
        let pokeAutocompleteResults = [];
        // Bumped on every new keystroke-triggered search so a slow response
        // to an earlier (now-stale) query can't overwrite the list after a
        // faster response to what the user typed next has already rendered.
        let pokeAutocompleteRequestId = 0;

        function pokeAutocompleteHandler(e) {
            clearTimeout(pokeSearchTimeout);
            const query = e.target.value.trim();
            const list = document.getElementById('pokeAutocompleteList');

            if (query.length < 2) {
                pokeAutocompleteRequestId++;
                list.innerHTML = '';
                return;
            }

            list.innerHTML = '<div class="loading">Searching...</div>';

            pokeSearchTimeout = setTimeout(() => {
                const requestId = ++pokeAutocompleteRequestId;
                const url = `${POKEMON_API_BASE}/cards?q=name:${encodeURIComponent(query)}*&pageSize=20&orderBy=-set.releaseDate`;
                pokemonFetchWithRetry(url, { retries: 1, baseDelayMs: 300 })
                    .then(res => res.json())
                    .then(data => {
                        if (requestId !== pokeAutocompleteRequestId) return; // a newer search already superseded this one
                        const cards = data.data || [];
                        pokeAutocompleteResults = cards;

                        if (cards.length > 0) {
                            list.innerHTML = cards.slice(0, 15).map((c, idx) => `
                                <div class="autocomplete-item" onclick="selectPokemonAutocompleteResult(${idx})">
                                    <strong>${c.name}</strong>
                                    <span style="color:#909090;"> — ${c.set.name} #${c.number}</span>
                                </div>
                            `).join('');
                        } else {
                            list.innerHTML = '<div class="autocomplete-item">No matches found</div>';
                        }
                    })
                    .catch(err => {
                        if (requestId !== pokeAutocompleteRequestId) return;
                        console.error('Pokemon search error:', err);
                        const message = (err && err.message) || 'Error fetching results';
                        list.innerHTML = `<div class="autocomplete-item" style="color:#ff9999;">${message}</div>`;
                    });
            }, 300);
        }

        // Jump straight to the exact card the user picked from autocomplete -
        // no ambiguity since we already have the full card object in hand.
        async function selectPokemonAutocompleteResult(idx) {
            const card = pokeAutocompleteResults[idx];
            if (!card) return;
            pokeLastAction = () => selectPokemonAutocompleteResult(idx);
            document.getElementById('pokeLiveSearch').value = '';
            document.getElementById('pokeAutocompleteList').innerHTML = '';

            const resultsDiv = document.getElementById('pokeResults');
            resultsDiv.innerHTML = skeletonHTML();

            try {
                await loadPokemonSets();
                let allCards = await pokemonSearch(`name:"${card.name}"`);
                allCards = allCards.filter(c => c.name === card.name);
                allCards.sort((a, b) => new Date(a.set.releaseDate) - new Date(b.set.releaseDate));
                if (allCards.length === 0) allCards = [card];

                pokeCurrentPrints = allCards;
                displayPokemonCard(card);
                renderPokemonPrintings(allCards, card.id);
                addToPokemonHistory(card.name);
            } catch (err) {
                console.error('Pokemon fetch error:', err);
                resultsDiv.innerHTML = buildPokemonErrorHTML(err);
            }
        }

        function lookupPokemonCard() {
            const cardName = document.getElementById('pokeDirectLookup').value.trim();
            const hint = document.getElementById('pokeSetHint').value.trim();
            if (!cardName) return;
            performPokemonLookup(cardName, hint);
        }

        // Run a Pokemon TCG API card search and return the array of results
        async function pokemonSearch(query) {
            const url = `${POKEMON_API_BASE}/cards?q=${encodeURIComponent(query)}&pageSize=250&orderBy=-set.releaseDate`;
            const res = await pokemonFetchWithRetry(url);
            const data = await res.json();
            return data.data || [];
        }

        // Remembers the last lookup so the error state's Retry button can
        // re-run the exact same request without the user retyping anything.
        let pokeLastAction = null;
        function retryPokemonLookup() {
            if (!pokeLastAction) return;
            pokeLastAction();
        }

        // Friendly error box with a Retry button. Distinguishes rate-limit and
        // server errors (transient, worth retrying) from "not found" (isn't).
        function buildPokemonErrorHTML(err) {
            const message = (err && err.message) || 'Something went wrong.';
            return `
                <div class="error">
                    ❌ ${message}
                    <div><button class="moonshot-check-btn" style="margin-top:10px;" onclick="retryPokemonLookup()">Retry</button></div>
                </div>
            `;
        }

        // Shared Pokemon lookup path. The public API has no single "fuzzy best
        // match" endpoint like Scryfall, so we try an exact phrase match first
        // (covers the common case of a fully-typed name), fall back to a prefix
        // wildcard on the first word if that comes up empty, then pull every
        // printing that shares whichever exact name we land on.
        //
        // setOrNumberHint is optional and is the real fix for Pokemon's name
        // collisions ("Pikachu" has 100+ different cards) - pass a set name
        // (or part of one, e.g. "Base Set") or the card's printed number
        // (e.g. "58" or "58/102") and matches get narrowed to that before we
        // pick which card to show.
        async function performPokemonLookup(rawName, setOrNumberHint) {
            pokeLastAction = () => performPokemonLookup(rawName, setOrNumberHint);
            const resultsDiv = document.getElementById('pokeResults');
            resultsDiv.innerHTML = skeletonHTML();
            const searchName = rawName.trim();
            const hint = (setOrNumberHint || '').trim();
            if (!searchName) return;

            try {
                await loadPokemonSets();

                // This unfiltered set of every card sharing the searched name
                // is kept around (as opposed to just the hint-narrowed list)
                // so "All Printings" can reuse it below instead of paying for
                // a second, near-identical API call.
                let allNameMatches = await pokemonSearch(`name:"${searchName}"`);
                if (allNameMatches.length === 0) {
                    const firstWord = searchName.split(/\s+/)[0];
                    allNameMatches = await pokemonSearch(`name:${firstWord}*`);
                }
                if (allNameMatches.length === 0) throw new Error('Card not found - check the spelling.');

                let matches = allNameMatches;
                let hintNote = '';
                if (hint) {
                    const hintLower = hint.toLowerCase();
                    const numberOnly = hint.split('/')[0].trim();
                    const narrowed = matches.filter(c => {
                        const ref = getPokemonSetReference(c.set.name);
                        return c.set.name.toLowerCase().includes(hintLower) ||
                            (c.set.ptcgoCode || '').toLowerCase() === hintLower ||
                            c.number === numberOnly ||
                            c.number.replace(/^0+/, '') === numberOnly.replace(/^0+/, '') ||
                            (ref && ref.era.toLowerCase().includes(hintLower));
                    });
                    if (narrowed.length > 0) {
                        matches = narrowed;
                    } else {
                        hintNote = ` (no match for "${hint}" - showing all)`;
                    }
                }

                const exactMatch = matches.find(c => c.name.toLowerCase() === searchName.toLowerCase());
                const canonicalName = exactMatch ? exactMatch.name : matches[0].name;

                // If the hint narrowed things to exactly one card, show that
                // exact printing directly instead of guessing "most recent"
                let primary;
                if (hint && matches.length >= 1 && matches.every(c => c.name === matches[0].name)) {
                    primary = matches[0];
                } else {
                    primary = exactMatch || matches[matches.length - 1];
                }

                // All Printings still shows every printing of the name (not just
                // the hint-narrowed set) so they can browse the rest if needed.
                // Reuse allNameMatches instead of re-querying the API for the
                // same data - saves a full round trip on every lookup.
                let allCards = allNameMatches.filter(c => c.name === primary.name);
                if (allCards.length === 0) allCards = allNameMatches;
                allCards.sort((a, b) => new Date(a.set.releaseDate) - new Date(b.set.releaseDate));

                pokeCurrentPrints = allCards;

                displayPokemonCard(primary);
                renderPokemonPrintings(allCards, primary.id);
                if (hintNote) {
                    const summaryEl = document.querySelector('#pokeAllPrintings summary');
                    if (summaryEl) summaryEl.textContent += hintNote;
                }
                addToPokemonHistory(primary.name);
                const inputEl = document.getElementById('pokeDirectLookup');
                if (inputEl) inputEl.value = '';
                const hintEl = document.getElementById('pokeSetHint');
                if (hintEl) hintEl.value = '';
            } catch (err) {
                console.error('Pokemon fetch error:', err);
                resultsDiv.innerHTML = buildPokemonErrorHTML(err);
            }
        }

        // Build the Pokemon pricing block. Unlike Magic's public data, the
        // Pokemon TCG API genuinely includes TCGplayer's low/mid/high/market
        // tiers per variant (normal, holofoil, reverse holofoil, 1st edition, etc.)
        function buildPokemonPriceHTML(card) {
            const tcg = card.tcgplayer && card.tcgplayer.prices;
            const tcgLink = card.tcgplayer && card.tcgplayer.url;

            if (!tcg) {
                return `<div class="price-block"><div class="price-note">No TCGplayer pricing available for this printing.</div></div>`;
            }

            const rows = Object.entries(tcg).map(([variant, p]) => {
                const fmt = v => (v || v === 0) ? `$${v.toFixed(2)}` : '—';
                return `
                    <div class="moonshot-result-item">
                        <span style="text-transform:capitalize;">${variant.replace(/([A-Z])/g, ' $1')}</span>
                        <span>Low ${fmt(p.low)} &nbsp; Mid ${fmt(p.mid)} &nbsp; High ${fmt(p.high)} &nbsp; Market ${fmt(p.market)}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="price-block" style="display:block;">
                    ${rows}
                    ${tcgLink ? `<a class="price-link" href="${tcgLink}" target="_blank" rel="noopener" style="display:inline-block; margin-top:6px;">View on TCGplayer →</a>` : ''}
                </div>
            `;
        }

        // Printable checklist link for this printing's set, sourced from the
        // TBC Games set reference table. Not every set has one published yet
        // (recent promos mostly don't), so this renders nothing when absent.
        function buildPokemonChecklistHTML(setRef) {
            if (!setRef || !setRef.checklist) return '';
            return `<a class="price-link" href="${setRef.checklist}" target="_blank" rel="noopener" style="display:inline-block; margin-top:6px;">📋 Printable Checklist →</a>`;
        }

        function renderPokemonLegality(card) {
            const container = document.getElementById('pokeLegalityContainer');
            if (!container) return;
            const legalities = card.legalities || {};
            const formats = ['standard', 'expanded', 'unlimited'];

            if (Object.keys(legalities).length === 0) {
                container.innerHTML = '';
                return;
            }

            const items = formats.map(fmt => {
                const raw = legalities[fmt];
                const status = raw ? raw.toLowerCase() : 'not_legal';
                const cssClass = status === 'legal' ? 'legal' : (status === 'banned' ? 'banned' : 'not_legal');
                return `
                    <div class="legality-item">
                        <span class="legality-format">${fmt}</span>
                        <span class="legality-status ${cssClass}">${raw || 'Not Legal'}</span>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="detail-label" style="margin-bottom:4px;">Format Legality</div>
                <div class="legality-grid">${items}</div>
            `;
        }

        function displayPokemonCard(card) {
            const resultsDiv = document.getElementById('pokeResults');
            pokeCurrentDisplayedCard = card;

            const setName = card.set.name;
            const setSeries = card.set.series;
            const year = card.set.releaseDate ? new Date(card.set.releaseDate).getFullYear() : 'Unknown';
            const setCode = (card.set.ptcgoCode || card.set.id || '').toUpperCase();

            pokeCurrentCardSetId = card.set.id;
            pokeCurrentCardSetName = setName;
            pokeCurrentCardReleasedAt = card.set.releaseDate;

            const imageUrl = card.images && (card.images.large || card.images.small);
            const imageHTML = imageUrl
                ? `<img class="card-image" id="pokeCardImageMain" src="${imageUrl}" alt="${card.name}" onclick="openPokemonLightbox()">`
                : '';

            let symbolHTML = '';
            if (card.set.images && card.set.images.symbol) {
                symbolHTML = `
                    <div class="set-symbol">
                        <img id="pokeSetSymbolImg" src="${card.set.images.symbol}" alt="${setName}" onerror="this.style.display='none'">
                    </div>
                    <div class="set-symbol-name" id="pokeSetSymbolName">${setName} <span style="color:#707070;">(${setSeries})</span></div>
                `;
            }

            const rarityHTML = card.rarity
                ? `<span class="rarity-badge" id="pokeRarityBadge" style="color:#d4af37;">${card.rarity}</span>`
                : '';

            const priceHTML = buildPokemonPriceHTML(card);
            const setRef = getPokemonSetReference(setName);
            const checklistHTML = buildPokemonChecklistHTML(setRef);

            const html = `
                <div class="card-result">
                    <div class="card-image-section">
                        ${imageHTML}
                        ${symbolHTML}
                        <div id="pokeChecklistContainer">${checklistHTML}</div>
                    </div>
                    <div class="card-info">
                        <div class="name-row">
                            <div class="card-name" id="pokeCardNameValue">${card.name}</div>
                            <span class="copy-icon" title="Copy card name" onclick="copyToClipboard(document.getElementById('pokeCardNameValue').textContent, 'card name')">📋</span>
                            ${rarityHTML}
                        </div>

                        <div class="card-detail">
                            <div class="detail-label">Set Code:</div>
                            <div class="detail-value" id="pokeSetCodeValue">${setCode}</div>
                            <span class="copy-icon" title="Copy set code" onclick="copyToClipboard(document.getElementById('pokeSetCodeValue').textContent, 'set code')">📋</span>
                        </div>

                        <div class="card-detail">
                            <div class="detail-label">Set:</div>
                            <div class="detail-value" id="pokeSetNameValue">${setName}</div>
                        </div>

                        <div class="card-detail">
                            <div class="detail-label">Year:</div>
                            <div class="detail-value" id="pokeYearValue">${year}</div>
                        </div>

                        <div class="card-detail" id="pokeEraContainer" style="${setRef ? '' : 'display:none;'}">
                            <div class="detail-label">Era:</div>
                            <div class="detail-value" id="pokeEraValue">${setRef ? setRef.era : ''}</div>
                        </div>

                        <div id="pokePriceContainer">${priceHTML}</div>

                        <div id="pokeMoonshotContainer"></div>

                        <div id="pokeAdjacentSetsContainer"></div>

                        <div class="card-detail" id="pokeTypeContainer" style="${card.supertype ? '' : 'display:none;'}">
                            <div class="detail-label">Type:</div>
                            <div class="detail-value" id="pokeTypeValue">${[card.supertype, ...(card.subtypes || [])].filter(Boolean).join(' - ')}</div>
                        </div>

                        <div class="card-detail" id="pokeHpContainer" style="${card.hp ? '' : 'display:none;'}">
                            <div class="detail-label">HP:</div>
                            <div class="detail-value" id="pokeHpValue">${card.hp || ''}</div>
                        </div>

                        <div id="pokeLegalityContainer"></div>

                        <details class="all-printings" id="pokeAllPrintings">
                            <summary>All Printings (loading...)</summary>
                            <div class="printings-list" id="pokePrintingsList"></div>
                        </details>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = html;

            updatePokemonAdjacentContext(card.set.id, setName, card.set.releaseDate);
            renderPokemonLegality(card);
            renderMoonshotBlockInto('pokeMoonshotContainer', card.name, null, setName);
        }

        function updatePokemonAdjacentContext(setId, fallbackName, fallbackReleasedAt) {
            const container = document.getElementById('pokeAdjacentSetsContainer');
            if (!container) return;

            let set = pokeSetsCache ? pokeSetsCache.find(s => s.id === setId) : null;
            if (!set) set = { id: setId, name: fallbackName, releaseDate: fallbackReleasedAt };

            const adjacent = getPokemonAdjacentSets(set.id, set.releaseDate);
            const setYear = set.releaseDate ? new Date(set.releaseDate).getFullYear() : '?';

            let html = '<div class="adjacent-sets">';
            html += `<div class="adjacent-item" style="color:#909090;">Showing context for: <strong style="color:#e0e0e0;">${set.name} (${setYear})</strong></div>`;

            if (adjacent.prev) {
                const prevYear = new Date(adjacent.prev.releaseDate).getFullYear();
                html += `<div class="adjacent-item"><span style="color:#909090;">← Before:</span> <span class="set-link" onclick="updatePokemonAdjacentContext('${adjacent.prev.id}')">${adjacent.prev.name} (${prevYear})</span></div>`;
            }
            if (adjacent.next) {
                const nextYear = new Date(adjacent.next.releaseDate).getFullYear();
                html += `<div class="adjacent-item"><span style="color:#909090;">After →</span> <span class="set-link" onclick="updatePokemonAdjacentContext('${adjacent.next.id}')">${adjacent.next.name} (${nextYear})</span></div>`;
            }

            if (pokeCurrentCardSetId && pokeCurrentCardSetId !== set.id) {
                const safeName = (pokeCurrentCardSetName || '').replace(/'/g, "\\'");
                html += `<div class="adjacent-item"><span class="set-link" onclick="updatePokemonAdjacentContext('${pokeCurrentCardSetId}', '${safeName}', '${pokeCurrentCardReleasedAt || ''}')">↺ Reset to this card's set</span></div>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function renderPokemonPrintings(cards, activeCardId) {
            const detailsEl = document.getElementById('pokeAllPrintings');
            const summaryEl = detailsEl ? detailsEl.querySelector('summary') : null;
            const listEl = document.getElementById('pokePrintingsList');
            if (!detailsEl || !listEl) return;

            summaryEl.textContent = `All Printings (${cards.length})`;

            listEl.innerHTML = cards.map((c, idx) => {
                const cYear = c.set.releaseDate ? new Date(c.set.releaseDate).getFullYear() : '?';
                const symbolImg = c.set.images && c.set.images.symbol
                    ? `<img src="${c.set.images.symbol}" alt="${c.set.id}" onerror="this.style.visibility='hidden'">`
                    : '';
                return `
                    <div class="printing-item" id="pokePrintingItem-${idx}" onclick="selectPokemonPrinting(${idx})">
                        ${symbolImg}
                        <div class="printing-set-name">${c.set.name}</div>
                        <div class="printing-meta">${cYear}</div>
                    </div>
                `;
            }).join('');

            const initialIdx = cards.findIndex(c => c.id === activeCardId);
            if (initialIdx !== -1) {
                const el = document.getElementById(`pokePrintingItem-${initialIdx}`);
                if (el) el.classList.add('active');
            }
        }

        function selectPokemonPrinting(idx) {
            const card = pokeCurrentPrints[idx];
            if (!card) return;
            pokeCurrentDisplayedCard = card;

            const imgEl = document.getElementById('pokeCardImageMain');
            const newImageUrl = card.images && (card.images.large || card.images.small);
            if (imgEl && newImageUrl) {
                imgEl.classList.add('fading');
                setTimeout(() => {
                    imgEl.src = newImageUrl;
                    imgEl.alt = card.name;
                    imgEl.classList.remove('fading');
                }, 150);
            }

            const setCode = (card.set.ptcgoCode || card.set.id || '').toUpperCase();
            const symbolImg = document.getElementById('pokeSetSymbolImg');
            const symbolName = document.getElementById('pokeSetSymbolName');
            if (symbolImg && card.set.images && card.set.images.symbol) {
                symbolImg.src = card.set.images.symbol;
                symbolImg.style.display = '';
                symbolImg.alt = card.set.name;
            }
            if (symbolName) symbolName.innerHTML = `${card.set.name} <span style="color:#707070;">(${card.set.series})</span>`;

            const setCodeEl = document.getElementById('pokeSetCodeValue');
            if (setCodeEl) setCodeEl.textContent = setCode;

            const setNameEl = document.getElementById('pokeSetNameValue');
            if (setNameEl) setNameEl.textContent = card.set.name;

            const yearEl = document.getElementById('pokeYearValue');
            if (yearEl) yearEl.textContent = card.set.releaseDate ? new Date(card.set.releaseDate).getFullYear() : 'Unknown';

            const setRef = getPokemonSetReference(card.set.name);
            const eraContainer = document.getElementById('pokeEraContainer');
            const eraEl = document.getElementById('pokeEraValue');
            if (eraContainer) eraContainer.style.display = setRef ? '' : 'none';
            if (eraEl) eraEl.textContent = setRef ? setRef.era : '';

            const checklistContainer = document.getElementById('pokeChecklistContainer');
            if (checklistContainer) checklistContainer.innerHTML = buildPokemonChecklistHTML(setRef);

            const rarityBadge = document.getElementById('pokeRarityBadge');
            if (rarityBadge && card.rarity) rarityBadge.textContent = card.rarity;

            const priceContainer = document.getElementById('pokePriceContainer');
            if (priceContainer) priceContainer.innerHTML = buildPokemonPriceHTML(card);

            renderPokemonLegality(card);

            // Reset the Moonshot block to match THIS printing so Check Stock
            // doesn't keep showing whatever was checked for a different printing.
            renderMoonshotBlockInto('pokeMoonshotContainer', card.name, null, card.set.name);

            document.querySelectorAll('#pokePrintingsList .printing-item.active').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`pokePrintingItem-${idx}`);
            if (activeEl) activeEl.classList.add('active');

            updatePokemonAdjacentContext(card.set.id, card.set.name, card.set.releaseDate);
        }

        function openPokemonLightbox() {
            const imgEl = document.getElementById('pokeCardImageMain');
            const overlay = document.getElementById('lightboxOverlay');
            const lightboxImg = document.getElementById('lightboxImage');
            if (!imgEl || !overlay || !lightboxImg) return;
            lightboxImg.src = imgEl.src;
            lightboxImg.alt = imgEl.alt;
            overlay.classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('open');
        }

        // Small toast notification (used for "Copied!" feedback)
        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        // Copy text to clipboard with a toast confirmation
        function copyToClipboard(text, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast(`Copied ${label}`))
                    .catch(() => showToast('Could not copy'));
            } else {
                showToast('Clipboard not available');
            }
        }

        // Skeleton placeholder shown while a lookup is in flight
        function skeletonHTML() {
            return `
                <div class="skeleton-result">
                    <div class="skeleton-block skeleton-image"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-block skeleton-line title"></div>
                        <div class="skeleton-block skeleton-line short"></div>
                        <div class="skeleton-block skeleton-line short"></div>
                        <div class="skeleton-block skeleton-line"></div>
                        <div class="skeleton-block skeleton-line"></div>
                        <div class="skeleton-block skeleton-line short"></div>
                    </div>
                </div>
            `;
        }

        // Attempt a live stock check against Moonshot's Shopify storefront.
        // Direct fetches are blocked by Moonshot's CORS policy from any external
        // origin, so this falls back to a chain of public CORS proxies, then
        // finally to a guaranteed "search on Moonshot" link. Each attempt is
        // time-boxed so a stalled/slow proxy can't hang the whole check, and
        // each is retried once before moving on to the next.
        const MOONSHOT_FETCH_TIMEOUT_MS = 6000;
        // corsproxy.io requires a paid API key and api.codetabs.com is
        // unreachable from a lot of networks - both verified dead as of
        // 2026-09, so they're left out. allorigins.win and proxy.cors.sh both
        // verified working; keeping two means one being down/rate-limited
        // doesn't take stock checks down entirely.
        const MOONSHOT_PROXIES = [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://proxy.cors.sh/${url}`
        ];
        // Remembers which method (direct, or one of the proxies) most recently
        // succeeded, so subsequent lookups in the same session try that one
        // first instead of always re-walking the whole chain from the top.
        let moonshotLastWorkingMethod = null; // null = direct, otherwise an index into MOONSHOT_PROXIES

        async function fetchWithTimeout(url, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        async function tryFetchJSON(url) {
            try {
                const res = await fetchWithTimeout(url, MOONSHOT_FETCH_TIMEOUT_MS);
                if (res.ok) return await res.json();
            } catch (err) {
                // fall through to caller's retry/fallback logic
            }
            return undefined; // sentinel: distinct from a legitimate null JSON response
        }

        // Try one method (direct fetch, or a specific proxy), with a single retry.
        async function tryMethodWithRetry(targetUrl, methodIndex) {
            const buildUrl = methodIndex === null ? (u => u) : MOONSHOT_PROXIES[methodIndex];
            for (let attempt = 0; attempt < 2; attempt++) {
                const result = await tryFetchJSON(buildUrl(targetUrl));
                if (result !== undefined) return result;
            }
            return undefined;
        }

        async function fetchMoonshotJSON(url) {
            // Try whatever method worked last time first - most sessions keep
            // using the same network path, so this avoids re-paying the cost
            // of failed attempts on every single lookup.
            const order = [moonshotLastWorkingMethod, null, 0, 1]
                .filter((v, i, arr) => arr.indexOf(v) === i); // de-dupe, preserve order

            for (const methodIndex of order) {
                const result = await tryMethodWithRetry(url, methodIndex);
                if (result !== undefined) {
                    moonshotLastWorkingMethod = methodIndex;
                    return result;
                }
            }

            console.warn('All Moonshot fetch attempts (direct + proxies) failed for', url);
            return null;
        }

        // Pull condition-level availability (NM/LP/MP/HP/D/etc.) for one product
        // via Shopify's public {handle}.js endpoint. This DOES tell us which
        // conditions are in stock, but it does NOT expose an exact quantity or
        // which physical location holds it - Shopify's public storefront simply
        // doesn't publish that level of detail without logging in.
        async function fetchProductVariants(productUrl) {
            const path = productUrl.split('?')[0];
            const jsUrl = `${MOONSHOT_BASE}${path}.js`;
            return await fetchMoonshotJSON(jsUrl);
        }

        // Moonshot's own product titles generally include the set name
        // somewhere in the title, so this prefers listings for the EXACT
        // printing currently on screen rather than whatever a plain name
        // search ranks first.
        function filterMoonshotProductsForPrinting(products, setCode, setName) {
            if (!setCode && !setName) return products;
            const codePrefix = setCode ? `${setCode.toLowerCase()}:` : null;
            const nameLower = setName ? setName.toLowerCase() : null;
            return products.filter(p => {
                const title = (p.title || '').toLowerCase();
                if (codePrefix && title.startsWith(codePrefix)) return true;
                if (nameLower && title.includes(nameLower)) return true;
                return false;
            });
        }

        // Generic version of the Moonshot block renderer - takes the container
        // id and the specific printing's set info so Check Stock can prefer a
        // listing for that exact printing.
        function renderMoonshotBlockInto(containerId, cardName, setCode, setName) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const safeName = cardName.replace(/'/g, "\\'");
            const safeSetCode = (setCode || '').replace(/'/g, "\\'");
            const safeSetName = (setName || '').replace(/'/g, "\\'");
            const searchUrl = `${MOONSHOT_BASE}/search?q=${encodeURIComponent(cardName)}`;
            const resultsId = containerId + 'Results';

            container.innerHTML = `
                <div class="moonshot-block">
                    <div class="moonshot-header">
                        <span class="moonshot-title">Moonshot Games</span>
                        <button class="moonshot-check-btn" onclick="checkMoonshotStockInto('${resultsId}', '${safeName}', '${safeSetCode}', '${safeSetName}')">Check Stock</button>
                    </div>
                    <div id="${resultsId}">
                        <a class="moonshot-link" href="${searchUrl}" target="_blank" rel="noopener">Search "${cardName}" on moonshotgamestore.com →</a>
                    </div>
                </div>
            `;
        }

        async function checkMoonshotStockInto(resultsElId, cardName, setCode, setName) {
            const resultsEl = document.getElementById(resultsElId);
            if (!resultsEl) return;
            const searchUrl = `${MOONSHOT_BASE}/search?q=${encodeURIComponent(cardName)}`;
            resultsEl.innerHTML = `<div class="moonshot-status">Checking...</div>`;

            const suggestUrl = `${MOONSHOT_BASE}/search/suggest.json?q=${encodeURIComponent(cardName)}&resources[type]=product&resources[limit]=10`;
            const data = await fetchMoonshotJSON(suggestUrl);

            if (!data) {
                resultsEl.innerHTML = `
                    <div class="moonshot-status">Live stock check unavailable right now.</div>
                    <a class="moonshot-link" href="${searchUrl}" target="_blank" rel="noopener">Search "${cardName}" on moonshotgamestore.com →</a>
                `;
                return;
            }

            const allProducts = (data.resources && data.resources.results && data.resources.results.products) || [];

            if (allProducts.length === 0) {
                resultsEl.innerHTML = `
                    <div class="moonshot-status">No matching listings found.</div>
                    <a class="moonshot-link" href="${searchUrl}" target="_blank" rel="noopener">Search "${cardName}" on moonshotgamestore.com →</a>
                `;
                return;
            }

            const matchedProducts = filterMoonshotProductsForPrinting(allProducts, setCode, setName);
            const usedExactPrinting = matchedProducts.length > 0;
            const products = usedExactPrinting ? matchedProducts : allProducts;

            let matchNoteHTML = '';
            if (setName) {
                matchNoteHTML = usedExactPrinting
                    ? `<div class="moonshot-status" style="margin-bottom:8px; color:#7ee787;">Showing listings for this printing (${setName}).</div>`
                    : `<div class="moonshot-status" style="margin-bottom:8px; color:#ffcc80;">No listing found specifically for ${setName} - showing other printings instead.</div>`;
            }

            const topProducts = products.slice(0, 3);
            const detailResults = await Promise.all(
                topProducts.map(p => fetchProductVariants(p.url))
            );

            const stockLookups = [];
            topProducts.forEach((p, i) => {
                const detail = detailResults[i];
                if (detail && detail.variants) {
                    detail.variants.forEach(v => {
                        if (v.available) stockLookups.push(v.id);
                    });
                }
            });
            const uniqueIds = [...new Set(stockLookups)];
            const stockResults = await Promise.all(uniqueIds.map(id => fetchVariantStock(id)));
            const stockById = {};
            uniqueIds.forEach((id, i) => { stockById[id] = stockResults[i]; });

            const productBlocks = topProducts.map((p, i) => {
                const detail = detailResults[i];
                const productLink = `${MOONSHOT_BASE}${p.url.split('?')[0]}`;

                if (!detail || !detail.variants) {
                    const price = p.price ? `$${p.price}` : '';
                    const availability = p.available === false ? 'Out of stock' : 'In stock';
                    return `
                        <div class="moonshot-result-item">
                            <span>${p.title}</span>
                            <span>${availability} · ${price} &nbsp; <a class="moonshot-link" href="${productLink}" target="_blank" rel="noopener">View →</a></span>
                        </div>
                    `;
                }

                const variantRows = detail.variants.map(v => {
                    const condition = v.public_title || v.title || 'Standard';
                    const price = v.price ? `$${(v.price / 100).toFixed(2)}` : '';

                    if (!v.available) {
                        return `
                            <div class="moonshot-result-item" style="padding-left:12px;">
                                <span>${condition}</span>
                                <span style="color:#707070;">Out of stock</span>
                                <span>${price}</span>
                            </div>
                        `;
                    }

                    const stock = stockById[v.id];
                    let locationBreakdown = 'In stock';
                    if (stock && stock.byGroup && stock.byGroupMeta) {
                        locationBreakdown = Object.entries(stock.byGroup)
                            .map(([key, qty]) => `${(stock.byGroupMeta[key] && stock.byGroupMeta[key].publicName) || key}: ${qty}`)
                            .join(' &nbsp;·&nbsp; ');
                    }

                    return `
                        <div class="moonshot-result-item" style="padding-left:12px;">
                            <span>${condition}</span>
                            <span style="color:#7ee787;">${locationBreakdown}</span>
                            <span>${price}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div style="margin-bottom:10px;">
                        <div class="moonshot-result-item" style="border-bottom:none; font-weight:600;">
                            <span>${detail.title || p.title}</span>
                            <a class="moonshot-link" href="${productLink}" target="_blank" rel="noopener">View →</a>
                        </div>
                        ${variantRows}
                    </div>
                `;
            }).join('');

            resultsEl.innerHTML = `
                ${matchNoteHTML}
                ${productBlocks}
                <div class="price-note" style="margin-top:6px;">Quantities are pulled live from Moonshot's own stock widget, per store location.</div>
            `;
        }

        // Exact per-location quantity for one variant, via Moonshot's own
        // stock-widget API (confirmed to send access-control-allow-origin: *,
        // so it works directly without needing the CORS-proxy fallback).
        async function fetchVariantStock(variantId) {
            return await fetchMoonshotJSON(`${MOONSHOT_BASE}/apps/moonshot/stock?variant=${variantId}`);
        }

        // Allow Enter key in Pokemon direct lookup (and the set/number hint field)
        document.getElementById('pokeDirectLookup').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') lookupPokemonCard();
        });
        document.getElementById('pokeSetHint').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') lookupPokemonCard();
        });
        document.getElementById('pokeLiveSearch').addEventListener('input', pokeAutocompleteHandler);

        // Initialize history
        loadPokemonHistory();
    </script>
</body>
</html>
